# Remove escape delay
set -s escape-time 0

# Remap prefix to Ctrl + k
set -g prefix C-k
unbind C-b
bind C-k send-prefix

# Reload config file
unbind r
bind r source-file ~/.tmux.conf

# Visual settings
#set -g default-terminal "screen-256color"
#set -ag terminal-overrides ",*256color*:Tc"
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set-option -ga update-environment " COLORTERM"
# Cursor box
set -g cursor-style block
# Double borders
 set -g pane-border-lines double
# Background - active regular, inactive greyed
set -g window-style 'bg=colour235'
set -g window-active-style 'fg=terminal,bg=terminal'
# Borders - active green (default), inactive white/grey
set -g pane-border-style "fg=colour250,bg=default"
set -g pane-active-border-style "#{?pane_in_mode,fg=yellow,fg=green}"
# Bottom status row - active cyan, select yellow, black otherwise
 set -g pane-border-status bottom
set -g pane-border-format " #{?pane_active,#{?pane_in_mode,#[bg=yellow]#[fg=black],#[bg=cyan]#[fg=black]} [ #{pane_index}: #{pane_current_command} ] #[default], [ #{pane_index}: #{pane_current_command} ] } "
# set -g pane-border-format " [ #[bold]#{pane_index}#[default]: #{pane_current_command} ] "
set -g mode-style "fg=black,bg=yellow"
# Tab - active yellow box
set-window-option -g window-status-current-style bg=yellow

# Enable/disable tab activity monitoring
setw -g monitor-activity off
set -g visual-activity off

# Set current directory and split
bind | attach -c '#{pane_current_path}' \; split-window -h
bind '"' attach -c '#{pane_current_path}' \; split-window -v
bind c attach -c '#{pane_current_path}' \; new-window
# Required for pane_current_path in Cygwin
set-environment -g CHERE_INVOKING 1

# Use Alt-Vim keys without prefix key to switch panes
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Use Alt-Vim keys without prefix key to move to next or previous window
bind -n M-n next-window
bind -n M-m previous-window
unbind m
bind m previous-window
unbind n
bind n next-window

# Resize panes with capital Vim keys
bind J resize-pane -D 20
bind K resize-pane -U 20
bind L resize-pane -R 20
bind H resize-pane -L 20

# Vim navigation keys in copy mode
unbind [
bind 'v' copy-mode
bind Escape copy-mode

set-window-option -g mode-keys vi
bind -T copy-mode-vi 'v' send -X begin-selection
bind -T copy-mode-vi 'r' send -X rectangle-toggle
bind -T copy-mode-vi 'y' send -X copy-selection

unbind p
bind p paste-buffer

# Ctrl-L to clear history like bash
bind C-l clear-history
